- name: Baseline configuration for all servers
  hosts: all
  become: true

  tasks:
    - name: Install common tools
      ansible.builtin.dnf:
        name:
          - vim-enhanced
          - tree
          - chrony
          - firewalld
        state: present

    - name: Make sure time sync is running and starts at boot
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    - name: Make sure the firewall is running and starts at boot
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
