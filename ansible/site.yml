- name: Baseline configuration for all servers
  hosts: all
  become: true

  tasks:
    - name: Install common tools
      ansible.builtin.dnf:
        name:
          - vim-enhanced
          - tree
          - chrony
          - firewalld
        state: present

    - name: Make sure time sync is running and starts at boot
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    - name: Make sure the firewall is running and starts at boot
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Create a service account for the app
      ansible.builtin.user:
        name: appsvc
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Harden SSH (no root login, keys only)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        mode: "0600"
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
